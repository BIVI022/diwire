name: Benchmarks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      performance_experiment:
        description: Run the frozen H005 experiment instead of competitor reports
        type: boolean
        default: false

      e2e_value_study:
        description: Run the bounded owner E2E value study without changing library source
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.e2e_value_study && 'e2e-value' || (inputs.performance_experiment && 'experiment' || 'report') }}
  cancel-in-progress: ${{ !inputs.performance_experiment && !inputs.e2e_value_study }}

jobs:
  benchmarks:
    if: ${{ !inputs.performance_experiment && !inputs.e2e_value_study }}
    name: Benchmark Report (Python 3.14)
    runs-on: ubuntu-latest
    env:
      BENCHMARK_ARTIFACT_DIR: benchmark-results/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run benchmark reports
        run: make benchmark-report benchmark-report-resolve

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/

      - name: Post sticky benchmark comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-results
          path: ${{ env.BENCHMARK_ARTIFACT_DIR }}/pr-comment.md

  performance-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_experiment }}
    name: H005 calibrated allocation experiment (Python 3.14.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout experiment controller
        uses: actions/checkout@v5
        with:
          path: controller
          persist-credentials: false

      - name: Checkout frozen subject
        uses: actions/checkout@v5
        with:
          ref: 7eaaf194905675bcd6505b9b434be9748798d3a7
          path: subject
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Install frozen Python and dependencies
        working-directory: subject
        run: |
          uv python install 3.14.6
          uv sync --locked --python 3.14.6 --group dev --group docs

      - name: Run one bounded calibration and comparison
        working-directory: controller
        run: |
          "$GITHUB_WORKSPACE/subject/.venv/bin/python" -m tests.performance.remote_experiment \
            --subject "$GITHUB_WORKSPACE/subject" \
            --output "$RUNNER_TEMP/h005-performance-experiment" \
            --protocol .agents/performance-evidence/2026-09-05/h005-linux-protocol.json \
            --archive .agents/performance-evidence/2026-09-05/h005-allocation.json.gz

      - name: Upload complete or partial experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h005-performance-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h005-performance-experiment/
          if-no-files-found: warn

  e2e-value-study:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_value_study }}
    name: Owner E2E value study (frozen baseline and candidate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out measurement controller
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned uv for conditional quality checks
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Extract frozen study harness outside the checkout
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "diwire-owner-e2e-value"
          root.mkdir()
          bundle = json.loads(Path(".agents/performance-evidence/2026-10-26-e2e-value/study-bundle.json").read_text())
          for name, content in bundle["files"].items():
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content)
          PYTHON

      - name: Run the fixed value study and conditional correctness gates
        run: |
          python3 "$RUNNER_TEMP/diwire-owner-e2e-value/bootstrap.py" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/.agents/performance-evidence/2026-10-26-e2e-value/study-bundle.json"

      - name: Upload all accepted, rejected or incomplete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-e2e-value-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diwire-owner-e2e-value/results/
          if-no-files-found: warn
