services:
  api:
    build:
      context: ../../..
      dockerfile: tests/e2e/litestar/Dockerfile
      args:
        PYTHON_VERSION: ${E2E_PYTHON_VERSION:-3.14}
    command: ["uv", "run", "python", "-m", "tests.e2e.litestar.setup.app"]
    environment:
      LITESTAR_E2E_HOST: "0.0.0.0"
      LITESTAR_E2E_PORT: "8240"
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8240/health', timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  tests:
    build:
      context: ../../..
      dockerfile: tests/e2e/litestar/Dockerfile
      args:
        PYTHON_VERSION: ${E2E_PYTHON_VERSION:-3.14}
    depends_on:
      api:
        condition: service_healthy
    environment:
      LITESTAR_E2E_BASE_HTTP_URL: "http://api:8240"
      LITESTAR_E2E_BASE_WS_URL: "ws://api:8240"
    command: ["uv", "run", "pytest", "tests/e2e/litestar/tests/test_endpoints.py", "-q", "-ra"]
