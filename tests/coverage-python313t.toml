# Python 3.13t cannot load the Litestar adapter because msgspec does not support it.
# This profile covers the core and other adapters. Other CI jobs cover the whole library.

[tool.coverage.run]
source = ["src/diwire"]
branch = true
parallel = true
omit = [
    "src/diwire/_internal/integrations/litestar.py",
    "src/diwire/integrations/litestar/__init__.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = true
